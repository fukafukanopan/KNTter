<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNTter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="has-bottom-ad">
  <header class="header">KNTter</header>
  <main class="page-layout">
    <aside class="ad-column ad-column-left" aria-label="広告">
      <section class="ad-card">
        <button class="ad-close" type="button" aria-label="左側の広告を閉じる">×</button>
        <p class="ad-label">PR</p>
        <img src="../image/fuurakanato.jpg" alt="風景の広告" />
        <p class="ad-copy">ひと息つける景色を、あなたの日常に。</p>
      </section>
    </aside>

    <section id="timeline" class="timeline" aria-label="投稿一覧" aria-live="polite">
      <p class="status">投稿を読み込んでいます...</p>
    </section>

    <aside class="ad-column ad-column-right" aria-label="広告">
      <section class="ad-card">
        <button class="ad-close" type="button" aria-label="右側の広告を閉じる">×</button>
        <p class="ad-label">PR</p>
        <img src="../image/fuurakanato.jpg" alt="風景の広告" />
        <p class="ad-copy">ひと息つける景色を、あなたの日常に。</p>
      </section>
    </aside>
  </main>

  <aside class="ad-column bottom-ad" aria-label="下部広告">
    <section class="ad-card bottom-ad-card">
      <button class="ad-close" type="button" aria-label="下部広告を閉じる">×</button>
      <p class="ad-label">PR</p>
      <img src="../image/fuurakanato.jpg" alt="風景の広告" />
      <p class="ad-copy">ひと息つける景色を、あなたの日常に。</p>
    </section>
  </aside>

  <template id="post-template">
    <article class="post">
      <div class="avatar" aria-hidden="true"></div>
      <div class="post-body">
        <p class="name"></p>
        <p class="meta"></p>
        <p class="post-text"></p>
        <img class="post-image" alt="" hidden />
        <div class="actions">
          <button class="reply" type="button" aria-label="返信">💬 <span></span></button>
          <button class="repost" type="button" aria-label="リポスト">🔁 <span></span></button>
          <button class="like" type="button" aria-label="いいね">❤ <span></span></button>
        </div>
      </div>
    </article>
  </template>

  <script src="../js/app.js?v=2" defer></script>
</body>
</html>
